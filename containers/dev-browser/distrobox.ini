# Distrobox container for dev-browser (browser automation for AI agents).
# Reproduces the working container on any machine. See README.md in this
# folder for the full setup sequence.

[dev-browser]
image=registry.fedoraproject.org/fedora:latest
additional_packages="nodejs npm nss atk at-spi2-atk cups-libs libX11 libXcomposite libXdamage libXext libXfixes libXrandr libXScrnSaver gtk3 alsa-lib libxkbcommon pango"
# nodejs/npm: runtime for the dev-browser CLI and its npm-installed deps.
# The rest are Chromium's required shared libraries (nss = libnspr4.so,
# atk/gtk/at-spi2 = accessibility stack, X11 libs = display, alsa/pango/
# libxkbcommon = audio/text/input). Miss one and Chromium fails to launch
# with a missing .so error.
