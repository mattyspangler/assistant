# Distrobox container for the primary dev workspace: VSCodium + OpenCode +
# Dagger/Podman client (to orchestrate sibling containers on the host) +
# dev-browser and its dependencies.

[codium-fedora]
image=registry.fedoraproject.org/fedora:latest
additional_packages="nodejs npm podman neovim uv gh nss atk at-spi2-atk cups-libs libX11 libXcomposite libXdamage libXext libXfixes libXrandr libXScrnSaver gtk3 alsa-lib libxkbcommon pango"
init_hooks="sudo rpm --import https://gitlab.com/paulcarroty/vscodium-deb-rpm-repo/raw/master/pub.gpg; echo '[gitlab.com_paulcarroty_vscodium_repo]' | sudo tee /etc/yum.repos.d/vscodium.repo; echo 'name=gitlab.com_paulcarroty_vscodium_repo' | sudo tee -a /etc/yum.repos.d/vscodium.repo; echo 'baseurl=https://paulcarroty.gitlab.io/vscodium-deb-rpm-repo/rpms/' | sudo tee -a /etc/yum.repos.d/vscodium.repo; echo 'enabled=1' | sudo tee -a /etc/yum.repos.d/vscodium.repo; echo 'gpgcheck=1' | sudo tee -a /etc/yum.repos.d/vscodium.repo; echo 'repo_gpgcheck=1' | sudo tee -a /etc/yum.repos.d/vscodium.repo; echo 'gpgkey=https://gitlab.com/paulcarroty/vscodium-deb-rpm-repo/raw/master/pub.gpg' | sudo tee -a /etc/yum.repos.d/vscodium.repo; echo 'metadata_expire=1h' | sudo tee -a /etc/yum.repos.d/vscodium.repo; sudo dnf install -y codium xdg-desktop-portal xdg-utils dejavu-sans-fonts; grep -q CONTAINER_HOST ~/.bashrc || echo 'export CONTAINER_HOST=unix:///run/host/run/user/1000/podman/podman.sock' >> ~/.bashrc; grep -q DOCKER_HOST ~/.bashrc || echo 'export DOCKER_HOST=unix:///run/host/run/user/1000/podman/podman.sock' >> ~/.bashrc"

# nodejs/npm: runtime for OpenCode (npm global install) and dev-browser.
# uv: isolated Python tool installs (e.g. mempalace via `uv tool install`).
# gh: GitHub CLI — git push/pull auth via `gh auth login` OAuth flow.
# podman: client only, to reach the HOST's Podman socket (see README —
#   requires systemctl --user enable --now podman.socket on the host).
# nss/atk/gtk3/X11/alsa/pango/libxkbcommon: dev-browser's Chromium deps,
#   same set as containers/dev-browser/distrobox.ini.
# init_hooks: VSCodium's own repo isn't a distrobox additional_packages
#   entry (it needs its repo file + key added first), so it's bootstrapped
#   via init_hooks instead.
